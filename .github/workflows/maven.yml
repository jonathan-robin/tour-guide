name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Afficher le chemin courant
        run: pwd
      - name: Build with Maven (with debug output)
        run: mvn clean install -X
        working-directory: TourGuide
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-jar
          path: TourGuide/target/*.jar
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run the Maven verify phase
        run: mvn verify
        working-directory: TourGuide
      - name: Afficher le chemin courant
        run: pwd

  package:
    runs-on: ubuntu-latest  # Définir l'environnement Ubuntu
    name: Build Docker Image
    needs: [build, test]  # Le job dépend de "build" et "test"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          - name: Check Docker version
            run: docker --version
          
          - name: Install Docker Compose (if missing)
            run: |
              if ! docker compose version &> /dev/null; then
                echo "Docker Compose plugin not found, installing standalone version..."
                sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                sudo chmod +x /usr/local/bin/docker-compose
              fi
          
          - name: Check Docker Compose version
            run: |
              docker compose version || docker-compose --version

      - name: Check Docker Compose version
        run: docker-compose --version
      - name: Docker Login
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: |
          ./mvnw install -PbuildDocker -DskipTests=true -DpushImage \
            -Dhttps.protocols=TLSv1.2 \
            -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Djava.awt.headless=true \
            --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true
      - name: Build and Push Docker Image
        run: |
          docker compose build
          docker compose push
