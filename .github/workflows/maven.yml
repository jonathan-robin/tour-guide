name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Install local Maven dependencies
        run: |
          mvn install:install-file -Dfile=TourGuide/libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar -X
          mvn install:install-file -Dfile=TourGuide/libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar -X
          mvn install:install-file -Dfile=TourGuide/libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar -X
        working-directory: /home/runner/work/tour-guide/tour-guide
      - name: Build with Maven (with debug output)
        run: mvn clean install -DskipTests
        working-directory: TourGuide
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-jar
          path: TourGuide/target/*.jar
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run the Maven verify phase
        run: mvn verify
        working-directory: TourGuide

  package:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - name: Check if Docker is installed
        run: |
          if ! docker --version &> /dev/null; then  # Si Docker n'est pas installé
            echo "Docker is not installed. Installing Docker..."  # Affiche un message
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io  # Installe Docker
          else
            echo "Docker is already installed."  # Affiche un message si Docker est déjà installé
          fi
      - name: Check if Docker Compose is installed
        run: |
          if ! docker compose version &> /dev/null; then  # Si Docker Compose n'est pas installé
            echo "Docker Compose is not installed. Installing Docker Compose..."  # Affiche un message
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose  # Donne les permissions d'exécution
          else
            echo "Docker Compose is already installed."  # Affiche un message si Docker Compose est déjà installé
          fi
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and Push Docker Image
        working-directory: TourGuide
        run: |
          docker compose build
          docker compose push
