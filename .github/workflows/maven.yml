# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.


name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Afficher le chemin courant
        run: pwd
      - name: Build with Maven (with debug output)
        run: mvn clean install -X
        working-directory: TourGuide 
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-jar
          path: TourGuide/target/*.jar
          retention-days: 7 


  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run the Maven verify phase
        run: mvn verify
        working-directory: TourGuide
      - name: Afficher le chemin courant
        run: pwd

  package:
    runs-on: ubuntu-latest  # Ajoutez ceci pour spécifier l'environnement
    name: Build Docker Image
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        run: |
          apk add --no-cache docker-cli-compose
      - name: Docker Login
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: |
          ./mvnw install -PbuildDocker -DskipTests=true -DpushImage \
            -Dhttps.protocols=TLSv1.2 \
            -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Djava.awt.headless=true \
            --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true
      - name: Build and Push Docker Image
        run: |
          docker compose build
          docker compose push

